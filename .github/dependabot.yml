# Weekly dependency updates, grouped so minor and patch bumps arrive as one PR
# per ecosystem; majors come one by one.
version: 2
updates:
  - package-ecosystem: composer
    directory: /
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 5
    groups:
      composer-minor:
        update-types: [minor, patch]
    commit-message: { prefix: 'chore(deps)' }

  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 5
    groups:
      npm-minor:
        update-types: [minor, patch]
    ignore:
      # vue-tsc and typescript-eslint do not support TypeScript 7 yet (the build
      # of the type checker and the linter breaks). Revisit when both do.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
      # vue-tsc 3.3.14 reports 15 false TS2339 errors on resources/js/pages/profile/Edit.vue
      # ("Property 'value' does not exist on type 'InertiaForm<CareerProfile>'"); 3.3.13 is clean.
      # Retry with the next release and drop this entry.
      - dependency-name: vue-tsc
        versions: ['3.3.14']
    commit-message: { prefix: 'chore(deps)' }

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday }
    groups:
      actions:
        patterns: ['*']
    commit-message: { prefix: 'ci' }

  # Base images in the Dockerfile and both compose files.
  - package-ecosystem: docker
    directory: /
    schedule: { interval: weekly, day: monday }
    commit-message: { prefix: 'chore(docker)' }

  - package-ecosystem: docker-compose
    directory: /
    schedule: { interval: weekly, day: monday }
    commit-message: { prefix: 'chore(docker)' }
    # A major Postgres bump needs pg_upgrade or a dump/restore of the data volume.
    ignore:
      - dependency-name: postgres
        update-types: ['version-update:semver-major']
