# Continuous delivery.
#   push to main      build the image for amd64 and arm64, publish it to GHCR
#                     (sha-<commit> and latest),
#                     scan it with Trivy and deploy it to staging
#   manual run        deploy any published tag to staging or production; running it
#                     with an older tag is the rollback
#
# Deployment targets (configure the one you use in the GitHub environment):
#   DEPLOY_HOOK_URL   secret: deploy hook of Render, Railway, Laravel Cloud or Forge
#   DEPLOY_SSH_HOST   variable + DEPLOY_SSH_USER, DEPLOY_SSH_KEY (secret), DEPLOY_PATH:
#                     a VPS running docker-compose.prod.yml
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: Where to deploy
        type: choice
        options: [staging, production]
        default: staging
      tag:
        description: Image tag to deploy (sha-<commit>, or latest)
        type: string
        default: latest

concurrency:
  group: deploy-${{ github.event.inputs.environment || 'staging' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # One native runner per architecture (no emulation): amd64 for CI and most
  # servers, arm64 for Oracle Ampere, AWS Graviton and Apple-silicon hosts.
  build:
    name: Build ${{ matrix.arch }}
    if: github.event_name == 'push'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    strategy:
      fail-fast: true
      matrix:
        include:
          - { arch: amd64, platform: linux/amd64, runner: ubuntu-24.04 }
          - { arch: arm64, platform: linux/arm64, runner: ubuntu-24.04-arm }
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}

      # Pushed by digest only; the "image" job below puts the tags on the pair.
      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: prod
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,scope=${{ matrix.arch }},mode=max
          # Attestations would nest an index inside each platform digest.
          provenance: false
          sbom: false

      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  image:
    name: Publish multi-arch image
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Image name and tag
        id: tag
        run: |
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
          echo "tag=sha-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ${{ runner.temp }}/digests
          pattern: digest-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag the manifest list
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        working-directory: ${{ runner.temp }}/digests
        run: |
          # shellcheck disable=SC2046
          docker buildx imagetools create -t "$IMAGE:$TAG" -t "$IMAGE:latest" \
            $(printf "$IMAGE@sha256:%s " *)

      - name: Inspect
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          docker buildx imagetools inspect "$IMAGE:$TAG"
          # Both architectures must be there, or the deploy would fail on one of them.
          docker buildx imagetools inspect "$IMAGE:$TAG" | grep -q 'linux/amd64'
          docker buildx imagetools inspect "$IMAGE:$TAG" | grep -q 'linux/arm64'

  scan:
    name: Trivy
    needs: image
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
      security-events: write
    steps:
      - name: Image reference
        id: ref
        env:
          TAG: ${{ needs.image.outputs.tag }}
        run: echo "ref=ghcr.io/${GITHUB_REPOSITORY,,}:${TAG}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Report only: findings land in the Security tab and do not block the deploy.
      - name: Scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.ref.outputs.ref }}
          format: sarif
          output: trivy.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '0'

      - uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: trivy.sarif
          category: trivy

  deploy:
    name: Deploy to ${{ github.event.inputs.environment || 'staging' }}
    needs: [image]
    # Manual runs skip the build and deploy an existing tag.
    if: always() && (needs.image.result == 'success' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: ${{ github.event.inputs.environment || 'staging' }}
      url: ${{ vars.APP_URL }}
    env:
      IMAGE_TAG: ${{ needs.image.outputs.tag || github.event.inputs.tag }}
      DEPLOY_HOOK_URL: ${{ secrets.DEPLOY_HOOK_URL }}
      DEPLOY_SSH_HOST: ${{ vars.DEPLOY_SSH_HOST }}
      DEPLOY_SSH_USER: ${{ vars.DEPLOY_SSH_USER }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/opt/matchly' }}
      APP_URL: ${{ vars.APP_URL }}
    steps:
      - name: Validate tag
        run: |
          # The tag ends up in a remote shell command: only our own tag formats.
          if ! printf '%s' "$IMAGE_TAG" | grep -Eqx 'latest|sha-[0-9a-f]{7,40}'; then
            echo "::error::Unexpected image tag: $IMAGE_TAG"
            exit 1
          fi
          echo "Deploying ghcr.io/${GITHUB_REPOSITORY,,}:$IMAGE_TAG"

      - name: Deploy hook (PaaS)
        if: env.DEPLOY_HOOK_URL != ''
        run: |
          # Render, Railway and Forge accept a plain POST; the image tag is passed
          # for hooks that support it and ignored by the rest.
          curl -fsS -X POST --retry 3 --data-urlencode "imgURL=ghcr.io/${GITHUB_REPOSITORY,,}:$IMAGE_TAG" "$DEPLOY_HOOK_URL" >/dev/null

      - name: SSH key (VPS)
        if: env.DEPLOY_HOOK_URL == '' && env.DEPLOY_SSH_HOST != ''
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_SSH_KNOWN_HOSTS: ${{ vars.DEPLOY_SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$DEPLOY_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Deploy over SSH (VPS)
        if: env.DEPLOY_HOOK_URL == '' && env.DEPLOY_SSH_HOST != ''
        run: |
          ssh -i ~/.ssh/id_deploy "$DEPLOY_SSH_USER@$DEPLOY_SSH_HOST" \
            "cd '$DEPLOY_PATH' && APP_TAG='$IMAGE_TAG' sh deploy/vps/deploy.sh"

      - name: Nothing configured
        if: env.DEPLOY_HOOK_URL == '' && env.DEPLOY_SSH_HOST == ''
        run: echo "::warning::No DEPLOY_HOOK_URL secret or DEPLOY_SSH_HOST variable in this environment; the image is published but not deployed."

      - name: Health check
        if: env.APP_URL != '' && (env.DEPLOY_HOOK_URL != '' || env.DEPLOY_SSH_HOST != '')
        run: |
          for _ in $(seq 1 30); do
            if curl -fsS -o /dev/null "$APP_URL/up"; then echo "Healthy"; exit 0; fi
            sleep 10
          done
          echo "::error::$APP_URL/up did not answer 200 within 5 minutes"
          exit 1
