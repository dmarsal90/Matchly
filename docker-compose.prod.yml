# Production on a single VPS: the image published by CI runs as web, Horizon,
# scheduler and Reverb, behind Caddy (automatic HTTPS with Let's Encrypt).
# Values come from .env next to this file (see deploy/env.production.example).
#
#   docker compose -f docker-compose.prod.yml up -d --wait
#   APP_TAG=sha-<commit> sh deploy/vps/deploy.sh      # deploy or roll back
#
# With managed PostgreSQL/Redis, point DB_HOST/REDIS_HOST at them and start only
# the services you need: docker compose -f docker-compose.prod.yml up -d caddy web horizon scheduler reverb
name: ${COMPOSE_PROJECT_NAME:-matchly}

x-logging: &logging
  # Logs go to stdout/stderr; Docker rotates them so the disk never fills up.
  driver: json-file
  options:
    max-size: 10m
    max-file: '5'

x-app: &app
  image: ${APP_IMAGE:-ghcr.io/dmarsal90/matchly}:${APP_TAG:-latest}
  env_file: .env
  restart: unless-stopped
  logging: *logging
  networks: [internal]
  volumes:
    # User uploads (encrypted CVs, exports) shared by web and the workers.
    - storage:/var/www/html/storage/app
  depends_on:
    postgres:
      condition: service_healthy
      required: false
    redis:
      condition: service_healthy
      required: false

services:
  caddy:
    image: caddy:2.11.7-alpine
    restart: unless-stopped
    logging: *logging
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    environment:
      DOMAIN: ${APP_DOMAIN:?Set APP_DOMAIN in .env (e.g. matchly.example.com)}
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL in .env (Let's Encrypt account)}
    volumes:
      - ./deploy/vps/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks: [internal]
    depends_on:
      web:
        condition: service_healthy
    deploy:
      resources:
        limits: { cpus: '0.50', memory: 128M }

  # The only service that runs migrations (entrypoint "web" role).
  web:
    <<: *app
    command: web
    environment:
      RUN_MIGRATIONS: 'true'
    deploy:
      resources:
        limits: { cpus: '1.00', memory: 768M }

  # Queue workers. Scale with Horizon's config (config/horizon.php) or add a
  # second host running only this service.
  horizon:
    <<: *app
    command: horizon
    # Starts once web is healthy: migrations have run and web has seeded the
    # storage volume (concurrent first mounts race on copying it).
    depends_on:
      web:
        condition: service_healthy
    stop_grace_period: 60s
    deploy:
      resources:
        limits: { cpus: '1.00', memory: 1G }

  scheduler:
    <<: *app
    command: scheduler
    # Starts once web is healthy: migrations have run and web has seeded the
    # storage volume (concurrent first mounts race on copying it).
    depends_on:
      web:
        condition: service_healthy
    deploy:
      resources:
        limits: { cpus: '0.25', memory: 256M }

  reverb:
    <<: *app
    command: reverb
    # Starts once web is healthy: migrations have run and web has seeded the
    # storage volume (concurrent first mounts race on copying it).
    depends_on:
      web:
        condition: service_healthy
    deploy:
      resources:
        limits: { cpus: '0.50', memory: 256M }

  postgres:
    image: postgres:17.11-alpine
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env} # ggignore: read from .env, no value here
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks: [internal]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 20
    deploy:
      resources:
        limits: { cpus: '1.00', memory: 1G }

  redis:
    image: redis:8.10.2-alpine
    restart: unless-stopped
    logging: *logging
    command: [redis-server, --appendonly, 'yes', --requirepass, '${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}'] # ggignore: read from .env
    volumes:
      - redis-data:/data
    networks: [internal]
    healthcheck:
      test: [CMD-SHELL, 'redis-cli -a "$$REDIS_PASSWORD" --no-auth-warning ping | grep -q PONG']
      interval: 5s
      timeout: 3s
      retries: 20
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    deploy:
      resources:
        limits: { cpus: '0.50', memory: 256M }

  # Nightly pg_dump, kept BACKUP_KEEP_DAYS days. Copy ./backups off the host
  # (rclone, restic, provider snapshots): a backup on the same disk is not enough.
  backup:
    image: postgres:17.11-alpine
    restart: unless-stopped
    logging: *logging
    command: [sh, /usr/local/bin/backup.sh]
    environment:
      PGHOST: postgres
      PGDATABASE: ${DB_DATABASE}
      PGUSER: ${DB_USERNAME}
      PGPASSWORD: ${DB_PASSWORD}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      BACKUP_AT: ${BACKUP_AT:-03:30}
    volumes:
      - ./deploy/vps/backup.sh:/usr/local/bin/backup.sh:ro
      - ${BACKUP_PATH:-./backups}:/backups
    networks: [internal]
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits: { cpus: '0.50', memory: 256M }

networks:
  internal:

volumes:
  storage:
  postgres-data:
  redis-data:
  caddy-data:
  caddy-config:
